<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuastoFix Milano - Gestione Guasti Condominiali</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f5f7fa;margin:0;padding:20px}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{margin:0 0 8px} .sub{color:#666;margin-bottom:20px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:700;font-size:16px;margin-top:10px}
.btn-green{background:#16a34a;color:#fff} .btn-black{background:#111;color:#fff}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;box-sizing:border-box}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="card">
<span class="badge">PER AMMINISTRATORI MILANO</span>
<h1>🛠️ GuastoFix Milano</h1>
<div class="sub">Basta chiamate dei condòmini. QR nel condominio, guasto gestito in automatico.</div>
<label>Condominio</label>
<input id="cond" placeholder="Es. Via Padova 12, Milano">
<label>Tipo guasto</label>
<select id="tipo"><option>Ascensore bloccato</option><option>Perdita acqua</option><option>Porta / Cancello</option><option>Luce scale</option><option>Caldaia</option></select>
<label>Descrizione</label>
<textarea id="desc" rows="3" placeholder="Piano, cosa succede..."></textarea>
<button class="btn btn-green" onclick="invia()">+ Segnala Guasto (Demo)</button>
<button class="btn btn-black" onclick="alert('Demo Milano: QR + tecnico assegnato automatico')">⚡ Vedi come funziona</button>
<div id="ok" style="display:none;margin-top:16px;background:#f0fdf4;padding:12px;border-radius:10px;color:#166534"></div>
<p style="font-size:12px;color:#888;margin-top:20px">Demo live per amministratori Milano. Attivazione 5 min. 99€ per i primi 3 condomini.</p>
</div>
<script>
function invia(){
const c=document.getElementById('cond').value||'Condominio Milano';
const t=document.getElementById('tipo').value;
const d=document.getElementById('ok');
d.style.display='block';
d.innerHTML='✅ Ricevuto per <b>'+c+'</b><br>Tipo: '+t+'<br><br>Amministratore e tecnico avvisati.';
window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html
