<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiroBar Pro</title></head><body style="font-family:system-ui;padding:16px;max-width:480px;margin:0 auto;background:#f8fafc"><h1>🍺 GiroBar Pro</h1><p style="color:gray">Giro bar ottimizzato Ferrara</p><div id="stats" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px"></div><div style="background:white;padding:12px;border-radius:12px;margin-top:16px"><input id="nome" placeholder="Nome bar" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px"><input id="indirizzo" placeholder="Indirizzo" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px"><button onclick="aggiungi()" style="width:100%;background:#16a34a;color:white;padding:14px;border-radius:8px;font-weight:700;border:0">+ Aggiungi Bar</button></div><button onclick="calcola()" style="width:100%;background:black;color:white;padding:16px;border-radius:12px;font-weight:800;margin-top:12px;border:0">⚡ CALCOLA GIRO</button><div id="lista"></div><div id="maps"></div><script>let bars=[{id:1,nome:"Bar Centrale",indirizzo:"Via Roma 10, Ferrara",lat:44.8381,lng:11.6198},{id:2,nome:"Bar Sport",indirizzo:"Corso Giovecca 20, Ferrara",lat:44.835,lng:11.62}];function haversine(a,b){const R=6371;const dLat=(b.lat-a.lat)*Math.PI/180;const dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180;const la2=b.lat*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}function calcola(){let r=[...bars];let p=[r.shift()];while(r.length){let u=p[p.length-1];let idx=0;let min=Infinity;r.forEach((b,i)=>{let d=haversine(u,b);if(d<min){min=d;idx=i;}});p.push(r.splice(idx,1)[0]);}let km=0;for(let i=1;i<p.length;i++)km+=haversine(p[i-1],p[i]);let ore=p.length*0.25+km/40;let costo=(km*6/100)*1.85;document.getElementById('stats').innerHTML=`<div style="background:white;padding:12px;border-radius:12px;text-align:center"><b>${km.toFixed(1)} km</b><br><span style="font-size:12px">Distanza</span></div><div style="background:white;padding:12px;border-radius:12px;text-align:center"><b>${ore.toFixed(1)} h</b><br><span style="font-size:12px">Tempo</span></div><div style="background:white;padding:12px;border-radius:12px;text-align:center"><b>€${costo.toFixed(2)}</b><br><span style="font-size:12px">Benzina</span></div>`;let html='<h3>📍 Giro</h3>';p.forEach((b,i)=>{html+=`<div style="background:white;padding:12px;border-radius:10px;margin-top:8px;display:flex;gap:10px"><div style="background:black;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center">${i+1}</div><div style="flex:1"><b>${b.nome}</b><br><span style="font-size:12px">${b.indirizzo}</span></div><button onclick="elimina(${b.id})" style="border:0;background:#fee2e2;padding:6px;border-radius:6px">X</button></div>`});document.getElementById('lista').innerHTML=html;document.getElementById('maps').innerHTML=`<a href="https://www.google.com/maps/dir/${p.map(b=>`${b.lat},${b.lng}`).join("/")}" target="_blank" style="display:block;text-align:center;background:#2563eb;color:white;padding:16px;border-radius:12px;margin-top:12px;text-decoration:none;font-weight:800">🗺️ APRI IN GOOGLE MAPS</a>`;}async function geocode(ind){try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ind)}`);const j=await r.json();if(j[0])return{lat:parseFloat(j[0].lat),lng:parseFloat(j[0].lon)};}catch(e){}return{lat:44.838+Math.random()*0.05,lng:11.619+Math.random()*0.05};}async function aggiungi(){let nome=document.getElementById('nome').value;let indirizzo=document.getElementById('indirizzo').value;if(!nome)return alert('Scrivi nome');let c=await geocode(indirizzo||nome);bars.push({id:Date.now(),nome:nome,indirizzo:indirizzo,lat:c.lat,lng:c.lng});document.getElementById('nome').value='';document.getElementById('indirizzo').value='';calcola();}function elimina(id){bars=bars.filter(x=>x.id!==id);calcola();}calcola();</script></body></html!
